<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Submission</title>
</head>
<body>
    <h1>Form for New Recipes</h1>
    <form action="index.html">
        <label for="name">Recipe Name:</label>
        <input type="text" id="name" name="name"><br><br>

        <label for="ingredients">Ingredients:</label><br>
        <textarea id="ingredients" name="ingredients"></textarea><br>
        
        <label for="instructions">Instructions:</label><br>
        <textarea id="instructions" name="instructions"></textarea><br>
        
        <label>Difficulty:</label><br>
        <input type="radio" id="easy" name="difficulty" value="easy">
        <label for="easy">Easy</label><br>
        <input type="radio" id='medium' name='difficulty' value='medium'>
        <label for='medium'>Medium</label><br>
        <input type='radio' id='hard' name='difficulty' value='hard'>
        <label for='hard'>Hard</label><br>
        
        <label>Dietary Restrictions:</label><br>
        <input type='checkbox' id='vegan' name='dietary_restrictions' value='vegan'>
        <label for='vegan'>Vegan</label><br>
        <input type='checkbox' id='vegetarian' name='dietary_restrictions' value='vegetarian'>
        <label for='vegetarian'>Vegetarian</label><br>
        <input type='checkbox' id='low-cal' name='dietary_restrictions' value='low-cal'>
        <label for='low-cal'>Low Calorie</label><br>
        
        <br>
        <input type='submit' value='Submit'> 
    </form> 
</body>
</html>
